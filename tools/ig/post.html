<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=block">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05071a}
#c{position:relative;width:1080px;height:1350px;overflow:hidden;background:radial-gradient(120% 90% at 50% 110%,#15114f 0%,#0a0e2c 45%,#05071a 100%);--a:#4ff0e0}
canvas{position:absolute;inset:0;width:1080px;height:1350px}
.wrap{position:absolute;inset:0;padding:84px 84px 0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:18px}
.mark{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#7cf2e4 0%,#3c52c4 52%,#140d38 100%);box-shadow:0 0 30px rgba(79,240,224,.35);position:relative}
.mark::after{content:"";position:absolute;inset:-9px -16px;border:2px solid #e9d6a8;border-radius:50%;transform:rotate(-18deg);opacity:.85}
.brand{font:600 34px/1 "Cormorant Garamond",serif;color:#f2f4ff;letter-spacing:.01em}
.brand small{display:block;font:500 15px/1.3 "JetBrains Mono",monospace;letter-spacing:.2em;color:#9aa4d6;text-transform:uppercase;margin-top:4px}
.eyebrow{margin-top:70px;font:700 22px/1 "JetBrains Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--a)}
.title{margin-top:24px;font:600 104px/.98 "Cormorant Garamond",serif;color:#f2f4ff;letter-spacing:-.01em}
.title i{font-style:italic;background:linear-gradient(100deg,#d9e4ff,#9fd8e6 35%,#c9b3ff 70%,#e9d6a8);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:6px}
.sub{margin-top:28px;font:500 32px/1.42 Manrope,sans-serif;color:#c4cbec;max-width:880px}
.body{flex:1;margin-top:46px;position:relative}
.foot{position:absolute;left:84px;right:84px;bottom:70px;display:flex;align-items:center;justify-content:space-between}
.cta{font:700 30px/1 Manrope,sans-serif;color:#05071a;background:linear-gradient(100deg,#7cf2e4,#c9b3ff);padding:22px 32px;border-radius:999px;box-shadow:0 10px 40px rgba(79,240,224,.25)}
.url{font:500 24px/1 "JetBrains Mono",monospace;color:#c4cbec;letter-spacing:.06em}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(170,185,255,.22);border-radius:30px;backdrop-filter:blur(6px)}
/* list */
.list{display:grid;gap:18px}
.list .it{display:flex;gap:24px;align-items:center;padding:24px 28px}
.list .n{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:700 24px/1 "JetBrains Mono",monospace;color:#05071a;background:var(--a);box-shadow:0 0 22px color-mix(in srgb,var(--a) 60%,transparent)}
.list .t{font:700 31px/1.25 Manrope,sans-serif;color:#f2f4ff}
.list .t span{display:block;font:500 24px/1.35 Manrope,sans-serif;color:#aab3e0;margin-top:5px}
/* tiers */
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tier{padding:30px 30px 32px;position:relative}
.tier .b{display:inline-flex;align-items:center;gap:12px;font:700 24px/1 "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--t);border:2px solid var(--t);border-radius:999px;padding:11px 18px;background:color-mix(in srgb,var(--t) 14%,transparent)}
.tier .b::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--t);box-shadow:0 0 14px var(--t)}
.tier .p{margin-top:22px;font:600 60px/1 "Cormorant Garamond",serif;color:#f2f4ff}
.tier .p small{font:500 22px/1 Manrope,sans-serif;color:#9aa4d6}
.tier .d{margin-top:14px;font:500 24px/1.38 Manrope,sans-serif;color:#c4cbec}
/* tags */
.members{display:grid;gap:16px}
.mem{display:flex;align-items:center;gap:22px;padding:20px 26px}
.av{width:70px;height:70px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 30px/1 Manrope,sans-serif;color:#05071a;background:var(--t)}
.mem .nm{font:700 30px/1 Manrope,sans-serif;color:#f2f4ff}
.mem .tg{margin-left:auto;font:700 22px/1 "JetBrains Mono",monospace;letter-spacing:.1em;color:var(--t);border:2px solid var(--t);border-radius:12px;padding:10px 14px;background:color-mix(in srgb,var(--t) 14%,transparent)}
.mem .msg{font:500 22px/1.3 Manrope,sans-serif;color:#aab3e0;margin-top:8px}
/* chat */
.chat{display:flex;flex-direction:column;gap:22px;padding:34px}
.bub{max-width:80%;padding:24px 28px;border-radius:28px;font:500 30px/1.42 Manrope,sans-serif}
.me{align-self:flex-end;background:linear-gradient(120deg,#7cf2e4,#9fb4ff);color:#05071a;border-bottom-right-radius:8px;font-weight:700}
.as{align-self:flex-start;background:rgba(20,26,66,.9);border:1px solid rgba(170,185,255,.25);color:#e6eaff;border-bottom-left-radius:8px}
.as b{color:#7cf2e4}
.who{font:700 18px/1 "JetBrains Mono",monospace;letter-spacing:.18em;color:#9aa4d6;text-transform:uppercase;margin-bottom:-10px}
/* recall */
.rc{padding:36px 38px}
.rc .sev{display:inline-flex;gap:12px;align-items:center;font:700 22px/1 "JetBrains Mono",monospace;letter-spacing:.16em;color:#ff8a8a;border:2px solid #ff8a8a;border-radius:999px;padding:11px 18px;background:rgba(255,120,120,.1)}
.rc .h{margin-top:24px;font:600 52px/1.05 "Cormorant Garamond",serif;color:#f2f4ff}
.rc .row{display:flex;gap:20px;margin-top:22px;padding-top:22px;border-top:1px solid rgba(170,185,255,.18)}
.rc .k{flex:none;width:220px;font:700 20px/1.4 "JetBrains Mono",monospace;letter-spacing:.12em;color:#9aa4d6;text-transform:uppercase}
.rc .v{font:600 28px/1.35 Manrope,sans-serif;color:#e6eaff}
/* app */
.app{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tile{padding:28px;min-height:170px}
.tile.w{grid-column:1/3}
.tile .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font:700 26px/1 Manrope,sans-serif;color:#05071a;background:var(--a);box-shadow:0 0 24px color-mix(in srgb,var(--a) 55%,transparent)}
.tile .tt{margin-top:18px;font:700 30px/1.2 Manrope,sans-serif;color:#f2f4ff}
.tile .td{margin-top:8px;font:500 23px/1.38 Manrope,sans-serif;color:#aab3e0}
.chips{display:flex;flex-wrap:wrap;gap:14px}
.chips span{font:700 26px/1 Manrope,sans-serif;color:#f2f4ff;padding:16px 22px;border-radius:999px;border:1px solid rgba(170,185,255,.3);background:rgba(13,17,46,.66)}
/* hero */
.globe{position:absolute;right:-150px;bottom:150px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#7cf2e4 0%,#3c52c4 50%,#140d38 100%);box-shadow:0 0 120px rgba(79,240,224,.28),inset -40px -60px 110px rgba(5,7,26,.7);opacity:.9}
.orb{position:absolute;right:-260px;bottom:330px;width:780px;height:220px;border:2px solid #e9d6a8;border-radius:50%;transform:rotate(-16deg);opacity:.55}
.lbl{position:absolute;font:700 22px/1 "JetBrains Mono",monospace;color:#e9eeff;padding:12px 16px;border-radius:999px;background:rgba(9,13,40,.82);border:1px solid rgba(190,200,255,.38)}
</style></head>
<body><div id="c"><canvas id="sky" width="2160" height="2700"></canvas><div class="wrap" id="w"></div></div>
<script>
const P=JSON.parse(decodeURIComponent(location.hash.slice(1)));
const C=document.getElementById('c'); C.style.setProperty('--a',P.accent||'#4ff0e0');
const cv=document.getElementById('sky'),g=cv.getContext('2d');g.scale(2,2);const W=1080,H=1350;
let seed=P.seed||7;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
for(let i=0;i<560;i++){g.fillStyle=`rgba(255,255,255,${.2+r()*.7})`;g.beginPath();g.arc(r()*W,r()*H*.8,r()*1.4+.2,0,7);g.fill();}
const off=document.createElement('canvas');off.width=270;off.height=338;const o=off.getContext('2d');o.scale(.25,.25);
function band(y,amp,col,wd,ph){const gr=o.createLinearGradient(0,y-wd,0,y+wd);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.5,col);gr.addColorStop(1,'rgba(0,0,0,0)');o.fillStyle=gr;o.beginPath();o.moveTo(0,y);for(let x=0;x<=W;x+=12)o.lineTo(x,y+Math.sin(x/W*Math.PI*2+ph)*amp-wd);for(let x=W;x>=0;x-=12)o.lineTo(x,y+Math.sin(x/W*Math.PI*2.6+ph)*amp+wd);o.closePath();o.fill();}
o.globalCompositeOperation='screen';const ph=(P.seed||1)*.7;
band(H*.16,90,'rgba(79,240,224,.5)',110,ph);band(H*.27,120,'rgba(166,107,255,.42)',100,ph+1.5);band(H*.12,70,'rgba(233,214,168,.18)',70,ph+3);
g.save();g.filter='blur(14px)';g.globalCompositeOperation='screen';g.drawImage(off,0,0,W,H);g.restore();
const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const em=s=>e(s).replace(/\*([^*]+)\*/g,'<i>$1</i>');
const TC={free:'#cfd6f2',basic:'#5fe3a1',pro:'#6fa8ff',vip:'#c08bff'};
let h=`<div class="top"><div class="mark"></div><div class="brand">${e(P.brand||'Jem Bezpiecznie')}<small>${e(P.brandSub||'bezpieczeństwo żywności')}</small></div></div>`;
if(P.layout==='hero') h+=`<div class="globe"></div><div class="orb"></div>`+(P.labels||[]).map((l,i)=>`<div class="lbl" style="right:${[300,60,380,120][i%4]}px;bottom:${[640,560,300,250][i%4]}px">${e(l)}</div>`).join('');
h+=`<div class="eyebrow">${e(P.eyebrow)}</div><div class="title" style="${P.ts?'font-size:'+P.ts+'px':''}">${em(P.title)}</div>`;
if(P.sub) h+=`<div class="sub">${em(P.sub)}</div>`;
let b='';
if(P.layout==='list') b=`<div class="list">${P.items.map((it,i)=>`<div class="it glass"><div class="n">${it.n||i+1}</div><div class="t">${e(it.t)}${it.d?`<span>${e(it.d)}</span>`:''}</div></div>`).join('')}</div>`;
if(P.layout==='tiers') b=`<div class="tiers">${P.items.map(it=>`<div class="tier glass" style="--t:${TC[it.k]}"><div class="b">${e(it.k.toUpperCase())}</div><div class="p">${e(it.p)} <small>${e(it.u||'')}</small></div><div class="d">${e(it.d)}</div></div>`).join('')}</div>`;
if(P.layout==='tags') b=`<div class="members">${P.items.map(it=>`<div class="mem glass" style="--t:${TC[it.k]}"><div class="av">${e(it.nick[0])}</div><div><div class="nm">${e(it.nick)}</div><div class="msg">${e(it.m)}</div></div><div class="tg">${e(it.k.toUpperCase())}</div></div>`).join('')}</div>`;
if(P.layout==='chat') b=`<div class="chat glass">${P.items.map(it=>it.me?`<div class="bub me">${e(it.me)}</div>`:`<div class="who">Jem Bezpiecznie</div><div class="bub as">${em(it.as).replace(/\*\*/g,'')}</div>`).join('')}</div>`;
if(P.layout==='recall') b=`<div class="rc glass"><div class="sev">● ${e(P.sev||'ALERT')}</div><div class="h">${e(P.rh)}</div>${P.items.map(it=>`<div class="row"><div class="k">${e(it.k)}</div><div class="v">${e(it.v)}</div></div>`).join('')}</div>`;
if(P.layout==='app') b=`<div class="app">${P.items.map((it,i)=>`<div class="tile glass${it.w?' w':''}"><div class="ic">${e(it.ic||'✓')}</div><div class="tt">${e(it.t)}</div><div class="td">${e(it.d)}</div></div>`).join('')}</div>`;
if(P.layout==='chips') b=`<div class="chips">${P.items.map(t=>`<span>${e(t)}</span>`).join('')}</div>`;
h+=`<div class="body">${b}</div><div class="foot"><div class="cta">${e(P.cta||'Sprawdź')} →</div><div class="url">${e(P.url||'jembezpiecznie.com')}</div></div>`;
document.getElementById('w').innerHTML=h;
document.fonts.ready.then(()=>{document.body.dataset.ready=1});
</script></body></html>
