name: Triple Market — Bitget Balance Parser QA
on:
  pull_request:
    paths:
      - 'lib/finance/balance-response.cjs'
      - 'test/balance-response.test.cjs'
      - '.github/workflows/triple-finance-balance-qa.yml'
  workflow_dispatch:
jobs:
  read_only_balance_tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Bitget Funding and UTA responses — offline
        run: node --test test/balance-response.test.cjs
