name: Quality production smoke

on:
  push:
    branches: [main]
    paths:
      - "public/quality/**"
      - "api/quality-*.js"
      - "lib/quality-*.js"
      - ".github/workflows/quality-production-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: https://supermarioofbot-iron-war.vercel.app
    steps:
      - name: Wait for production deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..24}; do
            BODY="$(curl -fsSL --max-time 20 "$BASE/app" || true)"
            if echo "$BODY" | grep -q 'QUALITY ASSURANCE SUPPORT'; then
              echo "Production is responding."
              exit 0
            fi
            echo "Waiting for production... $i/24"
            sleep 10
          done
          echo "Production did not become ready in time."
          exit 1

      - name: Verify public Quality pages
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "/app"
            "/login"
            "/quality/"
            "/quality/account/"
            "/quality/assistant/"
            "/quality/checkout/"
            "/quality/game/"
            "/quality/shipping/"
            "/quality/support/"
            "/quality/training/"
            "/quality/training/course/?id=hygiene"
            "/quality/auth.js"
            "/quality/experience.js"
          )
          for path in "${paths[@]}"; do
            file="$(mktemp)"
            code="$(curl -sS -L --max-time 25 -o "$file" -w '%{http_code}' "$BASE$path")"
            echo "$path -> $code"
            test "$code" = "200"
            if grep -Eiq '\bTelegram\b|\bbot\b|https?://t\.me/' "$file"; then
              echo "Forbidden public QA wording found at $path"
              grep -Ein '\bTelegram\b|\bbot\b|https?://t\.me/' "$file" || true
              exit 1
            fi
          done

      - name: Verify UI regression guards
        shell: bash
        run: |
          set -euo pipefail

          LOGIN="$(curl -fsSL --max-time 25 "$BASE/login")"
          if echo "$LOGIN" | grep -Fq 'status.classList.add("active")'; then
            echo "Safari-unsafe implicit status reference returned in production login."
            exit 1
          fi
          echo "$LOGIN" | grep -Fq 'statusEl.classList.add("active")' || {
            echo "Explicit login status element binding missing."
            exit 1
          }

          for path in "/quality/game/" "/quality/training/"; do
            BODY="$(curl -fsSL --max-time 25 "$BASE$path")"
            if echo "$BODY" | grep -Fq 'window.addEventListener("qa:plan",()=>window.QAExperience.applyPlan'; then
              echo "Recursive qa:plan -> applyPlan listener found at $path"
              exit 1
            fi
          done

      - name: Verify Quality Hub experience
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl -fsSL --max-time 25 "$BASE/app")"
          for text in "QUALITY ASSURANCE SUPPORT" "REGULAR" "BASIC" "PRO" "VIP" "Myszka Audytorka" "Akademia Jakości"; do
            echo "$BODY" | grep -Fq "$text" || { echo "Missing: $text"; exit 1; }
          done

      - name: Verify API anonymous boundaries
        shell: bash
        run: |
          set -euo pipefail
          assistant="$(curl -sS --max-time 20 -o /tmp/assistant -w '%{http_code}' "$BASE/api/quality-assistant")"
          test "$assistant" = "200"
          grep -q '"ok":true' /tmp/assistant

          dashboard="$(curl -sS --max-time 20 -X POST -H 'content-type: application/json' -d '{}' -o /tmp/dashboard -w '%{http_code}' "$BASE/api/quality-account?mode=dashboard")"
          test "$dashboard" = "401"

          support="$(curl -sS --max-time 20 -o /tmp/support -w '%{http_code}' "$BASE/api/quality-support")"
          test "$support" = "401"

          shipping="$(curl -sS --max-time 20 -o /tmp/shipping -w '%{http_code}' "$BASE/api/quality-shipping")"
          test "$shipping" = "401"

      - name: Verify login fails fast
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          code="$(curl -sS --max-time 15 -X POST             -H 'content-type: application/json'             -d '{"action":"sign_in","email":"qa-smoke-invalid@example.invalid","password":"Invalid!Pass123"}'             -o /tmp/login -w '%{http_code}'             "$BASE/api/quality-account?mode=web-auth")"
          elapsed="$(( $(date +%s) - start ))"
          echo "login HTTP=$code elapsed=${elapsed}s"
          test "$elapsed" -lt 15
          if [ "$code" -ge 500 ]; then cat /tmp/login; exit 1; fi
