name: Quality full E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/quality-full-e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run production Quality E2E
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ixivedtgqgryawxsxnqd.supabase.co/functions/v1/quality-e2e-runner"
          OUT="$(mktemp)"
          for attempt in {1..6}; do
            echo "E2E attempt $attempt..."
            CODE="$(curl --silent --show-error --location --max-time 220 --output "$OUT" --write-out "%{http_code}" "$URL" || true)"
            cat "$OUT" || true
            echo
            echo "HTTP=$CODE"
            if [ "$CODE" = "200" ]; then
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("ok") is True, d; assert int(d.get("failed",1))==0, d; assert int(d.get("total",0))>=20, d; print("QUALITY FULL E2E PASS {}/{}".format(d["passed"],d["total"]))' "$OUT"
              exit 0
            fi
            if [ "$CODE" = "429" ]; then
              sleep 60
              continue
            fi
            sleep 15
          done
          echo "Quality full E2E failed after retries."
          exit 1
