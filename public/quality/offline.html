<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brak połączenia · QA Support</title><meta name="theme-color" content="#05071a">
<link rel="manifest" href="/quality/manifest.webmanifest"><link rel="apple-touch-icon" href="/quality/icons/apple-touch-icon.png">
<style>
:root{--night:#05071a;--deep:#0a0e2c;--ink:#f2f4ff;--muted:#c4cbec;--line:rgba(170,185,255,.16);--glass:rgba(13,17,46,.58);--cyan:#4ff0e0;--violet:#a66bff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 30% 10%,#1b2260,var(--deep) 45%,var(--night));color:var(--ink);font-family:Manrope,system-ui,sans-serif}
.card{max-width:460px;width:100%;text-align:center;padding:32px 24px;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px)}
img{width:88px;height:88px;border-radius:22px}h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;margin:18px 0 8px}p{color:var(--muted);line-height:1.6}
button{margin-top:14px;padding:12px 22px;border-radius:999px;border:0;background:var(--ink);color:var(--night);font-weight:700;font-size:15px;cursor:pointer}
</style></head><body><main class="card">
<img src="/quality/icons/icon-192.png" alt="QA Support">
<h1>Jesteś offline</h1>
<p>Nie możemy połączyć się z QA Support. Sprawdź internet i spróbuj ponownie. Wcześniej otwarte strony mogą być dostępne z pamięci urządzenia.</p>
<button onclick="location.reload()">Spróbuj ponownie</button>
</main></body></html>
