<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Potwierdzenie – JemBezpiecznie</title>
<style>
:root{--bg:#05071a;--card:#0d1130;--line:#1d2456;--fg:#f2f4ff;--muted:#9aa3d6;--cyan:#4ff0e0;--warn:#ffb4a8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:460px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
h1{margin:0 0 10px;font-size:22px;color:var(--cyan)}p{margin:0 0 14px}.muted{color:var(--muted);font-size:14px}.warn{color:var(--warn)}
a.btn,button{display:inline-block;background:var(--cyan);color:var(--bg);font-weight:700;text-decoration:none;border:0;border-radius:10px;padding:12px 20px;font-size:16px;cursor:pointer}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:s 1s linear infinite;margin:6px 0 16px}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main id="box">
  <h1 id="h">Sprawdzam link…</h1>
  <div class="spin" id="spin"></div>
  <p id="msg" class="muted">To potrwa chwilę.</p>
  <p id="act" hidden></p>
</main>
<script>
(function(){
  var SB="https://ixivedtgqgryawxsxnqd.supabase.co", KEY="sb_publishable_4pWh6yauXpFbcTquaEvcsw_BAsUTu1Q";
  var q=new URLSearchParams(location.search), t=q.get("t")||"", type=q.get("type")||"", app=q.get("app")||"qa";
  var $=function(id){return document.getElementById(id)};
  function show(title,text,btnText,href,bad){
    $("spin").hidden=true;$("h").textContent=title;$("msg").textContent=text;$("msg").className=bad?"warn":"muted";
    if(btnText){$("act").hidden=false;$("act").innerHTML="";var a=document.createElement("a");a.className="btn";a.href=href;a.textContent=btnText;$("act").appendChild(a);}
  }
  var home=app==="jb"?"https://app.jembezpiecznie.com/":app==="portal"?"https://jembezpiecznie.com/":"/quality/login/";
  if(!t||["signup","recovery","magiclink"].indexOf(type)<0){show("Nieprawidłowy link","Ten link jest niepełny. Otwórz go ponownie z wiadomości e-mail albo poproś o nowy.","Przejdź do logowania",home,true);return;}
  // Link otwieramy dopiero po kliknięciu w przeglądarce (skanery poczty nie zużyją go wcześniej).
  function go(){
    $("act").hidden=true;$("spin").hidden=false;$("h").textContent="Sprawdzam link…";$("msg").textContent="To potrwa chwilę.";
    fetch(SB+"/auth/v1/verify",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({type:type,token_hash:t})})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d}})})
    .then(function(x){
      if(!x.ok||!x.d||!x.d.access_token){show("Link wygasł","Ten link został już użyty albo stracił ważność. Poproś o nowy na ekranie logowania.","Przejdź do logowania",home,true);return;}
      var d=x.d, kind=type==="recovery"?"recovery":"signup";
      var h="#access_token="+encodeURIComponent(d.access_token)+"&refresh_token="+encodeURIComponent(d.refresh_token||"")+"&expires_in="+(d.expires_in||3600)+"&token_type=bearer&type="+kind;
      if(app==="jb"){location.replace("https://app.jembezpiecznie.com/"+h);return;}
      if(app==="portal"&&kind==="signup"){show("Adres potwierdzony","Konto jest aktywne. Zaloguj się na portalu e-mailem i hasłem podanym przy rejestracji.","Przejdź do portalu","https://jembezpiecznie.com/#portal");return;}
      location.replace((kind==="recovery"?"/quality/reset/":"/quality/")+h);
    })
    .catch(function(){show("Brak połączenia","Nie udało się sprawdzić linku. Sprawdź internet i spróbuj ponownie.","Spróbuj ponownie",location.href,true);});
  }
  show(type==="recovery"?"Ustaw nowe hasło":"Potwierdź adres e-mail",type==="recovery"?"Stuknij przycisk, aby przejść do ustawienia nowego hasła.":"Stuknij przycisk, aby aktywować konto.",type==="recovery"?"Dalej":"Potwierdź",location.href);
  $("act").firstChild.addEventListener("click",function(e){e.preventDefault();go();});
})();
</script>
</body>
</html>
