<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quality Checkout</title><script src="/quality/auth.js"></script><style>
body{margin:0;background:#07111c;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 60px}h1{font-size:30px}.doc{border:1px solid #203b54;background:#0d1b2a;border-radius:16px;margin:12px 0;overflow:hidden}.doc summary{padding:16px;font-weight:800;cursor:pointer}.body{padding:0 16px 16px;white-space:pre-wrap;line-height:1.55;color:#d5dee7;max-height:45vh;overflow:auto}.check{display:flex;gap:10px;margin:14px 0;padding:13px;background:#10263a;border-radius:12px}.btn{width:100%;border:0;border-radius:14px;padding:15px;background:#3bd6a2;color:#04110c;font-weight:900;font-size:16px}.btn:disabled{opacity:.45}.err{color:#ff9b9b}.muted{color:#9eb0c1}.status{margin:14px 0}
select{width:100%;padding:13px;border-radius:12px;background:#10263a;color:#fff;border:1px solid #203b54}
</style><link rel="stylesheet" href="/quality/theme.css?v=20261004-vibrant">
<script defer src="/quality/experience.js?v=20261005-1"></script>
</head><body><div class="wrap"><h1 id="title">Bezpieczny zakup</h1><p class="muted" id="lead">Przeczytaj wymagane informacje. Zakup odblokuje się dopiero po potwierdzeniu wymaganych oświadczeń.</p><div id="status" class="status"></div><div id="docs"></div>
<label id="capacityLabel">Status kupującego</label><select id="capacity"><option value="consumer">Konsument</option><option value="entrepreneur_professional">Przedsiębiorca — zakup zawodowy</option><option value="entrepreneur_consumer_rights">Przedsiębiorca korzystający z praw konsumenta</option></select>
<label class="check"><input id="terms" type="checkbox"><span>Zapoznałem się i akceptuję Regulamin.</span></label>
<label class="check"><input id="privacy" type="checkbox"><span>Potwierdzam otrzymanie i zapoznanie się z informacją o przetwarzaniu danych.</span></label>
<label class="check"><input id="license" type="checkbox"><span>Akceptuję licencję i zasady korzystania z materiałów, w tym zakaz nieuprawnionego rozpowszechniania.</span></label>
<label class="check" id="immediateRow"><input id="immediate" type="checkbox"><span>Żądam natychmiastowego rozpoczęcia dostarczania treści cyfrowej przed upływem terminu odstąpienia.</span></label>
<label class="check" id="withdrawRow"><input id="withdraw" type="checkbox"><span>Przyjmuję do wiadomości ustawowy skutek rozpoczęcia dostarczania treści cyfrowej dla prawa odstąpienia.</span></label>
<button id="buy" class="btn" disabled>Kupuję i płacę</button></div><script>
const q=new URLSearchParams(location.search);const kind=q.get("kind")||"plan";const reference=q.get("ref")||q.get("buy")||"";const lang=q.get("lang")==="en"?"en":"pl";document.documentElement.lang=lang;
const statusEl=document.getElementById("status"),docsEl=document.getElementById("docs"),buy=document.getElementById("buy");
if(lang==="en"){title.textContent="Secure checkout";lead.textContent="Read the required notices. Payment unlocks only after the required statements are confirmed.";capacityLabel.textContent="Buyer status";buy.textContent="Buy and pay";}
const digital=["plan","product"].includes(kind);if(!digital){immediateRow.style.display="none";withdrawRow.style.display="none";}
const requiredKeys=digital?["terms","privacy","educational_disclaimer","content_license","digital_content_withdrawal"]:["terms","privacy","educational_disclaimer","content_license"];
function esc(s){const d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML}
async function api(method,body){const headers=await window.QualityAuth.headers({"content-type":"application/json"});const r=await fetch("/api/quality-account",{method,headers,...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"Request failed");return d}
function refresh(){buy.disabled=!(terms.checked&&privacy.checked&&license.checked&&(!digital||(immediate.checked&&withdraw.checked)))}
document.querySelectorAll("input[type=checkbox]").forEach(x=>x.addEventListener("change",refresh));
(async()=>{try{if(!(await window.QualityAuth.isAuthenticated())){location.href="/quality/login/?next="+encodeURIComponent(location.pathname+location.search);return;}const d=await api("GET");const docs=d.legal?.documents||[];const missing=requiredKeys.filter(k=>!docs.some(x=>x.document_key===k));if(missing.length)throw new Error("Legal checkout unavailable: "+missing.join(", "));
docsEl.innerHTML=requiredKeys.map(k=>{const x=docs.find(d=>d.document_key===k);return '<details class="doc"><summary>'+esc(x.title)+' · '+esc(x.version)+'</summary><div class="body">'+esc(x.body_md)+'</div></details>'}).join("");statusEl.textContent=lang==="en"?"Open each document and review it before confirming.":"Otwórz każdy dokument i zapoznaj się z nim przed potwierdzeniem.";}catch(e){statusEl.innerHTML='<span class="err">'+esc(e.message)+'</span>';buy.disabled=true}})();
buy.addEventListener("click",async()=>{buy.disabled=true;statusEl.textContent=lang==="en"?"Recording consents…":"Zapisuję zgody…";try{
let purchaseKind=kind==="plan"?"plan":kind==="product"?"digital_product":"token";
if(kind==="product"){const isTraining=q.get("type")==="training";if(isTraining)purchaseKind="training";}
const d=await api("POST",{action:"legal_consent",locale:lang,purchase_kind:purchaseKind,purchase_reference:reference,consent:{accepted_terms:true,acknowledged_privacy:true,accepted_license:true,requested_immediate_delivery:digital,acknowledged_loss_of_withdrawal:digital,marketing_consent:false,customer_capacity:capacity.value}});
const headers=await window.QualityAuth.headers({"content-type":"application/json"});const r=await fetch("/api/quality-purchase-invoice",{method:"POST",headers,body:JSON.stringify({kind,reference,consent_token:d.consent.consent_token})});const inv=await r.json();if(!r.ok||!inv.ok||!inv.invoice_link)throw new Error(inv.error||"Invoice failed");
location.href=inv.invoice_link;
}catch(e){statusEl.innerHTML='<span class="err">'+esc(e.message)+'</span>';buy.disabled=false}});
</script></body></html>
