<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quality Assurance Support — nowe hasło</title>
<script src="/quality/auth.js"></script>
<style>
:root{--bg:#07111c;--panel:#0d1b2a;--line:#203b54;--text:#f5f7fa;--muted:#9eb0c1;--accent:#3bd6a2;--danger:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#123858 0,transparent 35%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:520px;margin:auto;padding:44px 16px}.brand{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--accent)}h1{font-size:30px;margin:8px 0}
.lead{color:var(--muted);line-height:1.55}.panel{margin-top:22px;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}
label{display:block;margin:13px 0 7px;font-weight:800;font-size:13px}input{width:100%;border:1px solid var(--line);border-radius:13px;background:#08131d;color:var(--text);padding:14px;font:inherit}
.btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;font-weight:900;text-decoration:none;display:block;text-align:center;background:var(--accent);color:#06130f;font:inherit;font-weight:900}
.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
.status{margin-top:14px;line-height:1.5}.ok{color:var(--accent)}.err{color:var(--danger)}.small{color:var(--muted);font-size:13px;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">QUALITY ASSURANCE SUPPORT</div>
<h1>Ustaw nowe hasło</h1>
<div class="lead">Wpisz nowe hasło do swojego konta. Musi mieć co najmniej 12 znaków, małą i wielką literę, cyfrę oraz znak specjalny.</div>
<div class="panel" id="formPanel">
<label for="pw">Nowe hasło</label><input id="pw" type="password" autocomplete="new-password" minlength="12">
<label for="pw2">Powtórz hasło</label><input id="pw2" type="password" autocomplete="new-password" minlength="12">
<button class="btn" id="saveBtn">Zapisz nowe hasło</button>
<div class="status" id="status"></div>
</div>
<div class="small">Link do ustawienia hasła działa tylko przez ograniczony czas. Jeśli wygasł, wróć na stronę logowania i poproś o nowy.</div>
</div>
<script>
const qa=window.QualityAuth;
const statusEl=document.getElementById("status"),saveBtn=document.getElementById("saveBtn"),pwEl=document.getElementById("pw"),pw2El=document.getElementById("pw2");
function show(msg,ok=false){statusEl.innerHTML='<span class="'+(ok?'ok':'err')+'">'+String(msg).replace(/[<>&]/g,ch=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[ch]))+'</span>'}
(async()=>{
  if(!(await qa.isAuthenticated())){show("Nie ma aktywnego linku do zmiany hasła. Wróć na stronę logowania i kliknij „Nie pamiętam hasła”.");saveBtn.disabled=true;}
})();
saveBtn.onclick=async()=>{
  const a=pwEl.value,b=pw2El.value;
  if(a.length<12){show("Hasło musi mieć co najmniej 12 znaków.");return}
  if(a!==b){show("Hasła nie są takie same.");return}
  saveBtn.disabled=true;statusEl.textContent="Zapisuję…";
  const {error}=await qa.auth.updatePassword(a);
  saveBtn.disabled=false;
  if(error){show(error.message||"Nie udało się zmienić hasła.");return}
  show("Hasło zostało zmienione. Za chwilę przeniesiemy Cię do konta.",true);
  setTimeout(()=>{location.href="/quality/account/"},1500);
};
</script>
</body>
</html>
