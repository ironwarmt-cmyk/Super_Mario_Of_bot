<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<meta name="quality-release" content="2026-10-06-channel-link-v1">
<title>Połącz konto — Quality</title>
<link rel="stylesheet" href="/quality/theme.css?v=20261006-link">
<script src="/quality/auth.js"></script>
<style>
body{margin:0;background:#07111c;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:620px;margin:auto;padding:42px 18px 80px}.card{border:1px solid #203b54;background:#0d1b2a;border-radius:22px;padding:22px}
.kicker{font-size:12px;font-weight:900;letter-spacing:.08em;color:#3bd6a2}.muted{color:#9eb0c1;line-height:1.55}
.state{margin-top:18px;padding:14px;border-radius:14px;background:#10263a}.ok{color:#3bd6a2}.err{color:#ff9b9b}
.btn{display:inline-flex;margin-top:16px;text-decoration:none;border-radius:14px;padding:13px 16px;background:#3bd6a2;color:#04110c;font-weight:900}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="kicker">QUALITY ASSURANCE SUPPORT</div>
<h1>Połącz konto</h1>
<p class="muted">Zalogowane konto Quality zostanie bezpiecznie powiązane z dodatkowym kanałem. Pakiet, zakupione materiały i dostęp pozostaną wspólne.</p>
<div class="state" id="state">Weryfikuję bezpieczne połączenie…</div>
<a class="btn" id="back" href="/quality/account/" hidden>Przejdź do konta</a>
</div></div>
<script>
(async()=>{
  const state=document.getElementById("state"),back=document.getElementById("back");
  const token=new URLSearchParams(location.search).get("token")||"";
  const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  try{
    if(!/^[a-f0-9]{48}$/.test(token))throw new Error("Link jest nieprawidłowy albo wygasł.");
    if(!(await window.QualityAuth.isAuthenticated())){
      location.href="/quality/login/?next="+encodeURIComponent(location.pathname+location.search);
      return;
    }
    const headers=await window.QualityAuth.headers({"content-type":"application/json"});
    const r=await fetch("/api/quality-account",{method:"POST",headers,body:JSON.stringify({action:"complete_channel_link",token})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok)throw new Error(d.error||"Nie udało się połączyć kont.");
    state.innerHTML='<span class="ok">✓ Konta zostały połączone. Ten sam pakiet i dostęp są teraz rozpoznawane w obu miejscach.</span>';
    back.hidden=false;
  }catch(e){
    state.innerHTML='<span class="err">'+esc(e.message||e)+'</span>';
    back.hidden=false;
  }
})();
</script>
</body>
</html>
